# Nginx configuration for reverse proxy
# This file configures Nginx to act as a reverse proxy for our Flask application

events {
    # Events block: Global configuration affecting how Nginx handles connections
    # worker_connections: Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # HTTP block: Configuration for HTTP server
    
    # Define upstream server (our Flask application)
    # This is the backend that Nginx will forward requests to
    upstream app_backend {
        # The hostname 'app' matches the service name in docker-compose.yml
        # Docker's internal DNS resolves this to the app container
        server app:5000;
    }

    # Server block: Configuration für a specific virtual server
    server {
        # Listen on port 80 (standard HTTP port)
        listen 80;
        
        # Server name: Domain name this server responds to
        # myapp.local matches the entry we'll add to /etc/hosts
        server_name myapp.local localhost;

        # Location block: Configuration for handling specific URL paths
        location / {
            # Proxy all requests to the upstream Flask application
            proxy_pass http://app_backend;
            
            # Set headers to pass original request information to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optional: Timeouts for proxy connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
